# =============================================================================
# 聯茂 6213 損益推估模型 v45
#
# 設計原則：Layer 1 為骨架（少參數、每個都要有來源），Layer 2 為交叉驗證。
# 本版刻意「不」重建內部 v44 的 40 參數模型，而是用最少的良好來源參數重做一次，
# 再把結果與 v44 / 法人共識並排比較——差異本身就是資訊。
#
# confidence 定義：
#   硬   = 公司公開/親口給的數字（法說、財報、私訪逐字）
#   軟   = 公司給區間或方向，我們取其中一點
#   反解 = 由已公布財報回推出來的隱含值
#   推估 = 沒有一手來源，是我們自己填的（模型最脆弱處，稽核會列表）
# =============================================================================

meta:
  ticker: "6213"
  name: 聯茂
  archetype: A                    # A=產能驅動
  version: v45
  base_quarter: 2026Q2            # 最後一季有實際財報
  as_of_month: "2026-10"          # 滾動12M forward EPS 的起算月
  price_source: auto              # auto = 每次執行由 FinMind 抓即時收盤（建議）
  price: 517.0                    # 僅作為 FinMind 抓取失敗時的備援
  independent_observations: 12    # 誠實估計：26Q1/Q2 財報各約3個獨立數字 + 月營收趨勢 + 法說guidance
  unit_note: 營收獲利=億元、產能=萬張/月、ASP=元/張、股數=億股

horizon:
  start: 2026Q1
  end: 2027Q4

# ----------------------------------------------------------------- 實績
# 引擎會用這些數字做「基期校準」——模型在這些季度必須重現實績，否則
# 往前推的每一季都帶著同一個系統性偏差。有新財報就往下加。
actuals:
  2026Q1:
    revenue: 91.44
    gross_margin: 0.1142
    op_margin: 0.0464
    eps: 0.87
    source: 26Q1財報
  2026Q2:
    revenue: 115.30
    gross_margin: 0.2202
    op_margin: 0.1603
    eps: 3.52
    source: 26Q2財報（Daiwa/凱基交叉確認淨利12.79億）

# ----------------------------------------------------------------- 外部錨
consensus:
  source: 玉山投顧 2026-08-24（本庫最近一份完整年度預估）
  as_of: 2026-08-24
  eps:
    2026: 20.01
    2027: 52.32
  note: >
    同期其他券商：Nomura(0819) 17.19/33.64、凱基(0808) TP610隱含2027約20.3、
    Daiwa(0809) TP600。2027年賣方區間 20~52 元，離散度極大，
    代表「共識」本身就不是一個可靠的錨——這點必須寫在報告裡。

# ----------------------------------------------------------------- Layer 1
layer1:
  revenue:
    method: capacity
    capacity_months_per_quarter: 3
    asp_divisor: 10000            # 萬張 × 元/張 ÷ 10000 = 億元

    # 產能：公司公告擴產計畫，是本模型少數的硬資料
    capacity:
      2026Q1: {value: 570, source: 法說20260807 產能季別, confidence: 硬}
      2026Q4: {value: 630, source: 泰國一廠二期30萬張投產, confidence: 硬}
      2027Q1: {value: 630, source: 無錫21.3億人民幣擴產, confidence: 硬}
      2027Q3: {value: 720, source: 無錫2027年底60萬張, confidence: 軟}
      2027Q4: {value: 825, source: 無錫累計285萬張規劃, confidence: 軟}

    # 稼動率：26Q1/Q2 由財報反解，26Q3 之後採私訪 0813 口徑
    utilization:
      2026Q1: {value: 0.7358, source: 26Q1財報反解, confidence: 反解}
      2026Q2: {value: 0.7444, source: 26Q2財報反解, confidence: 反解}
      # 2026-09-06 對帳修正：7/8月實績連兩月高於模型，回推3Q26≈150.7億。
      # 營收=產能×稼動率×ASP 為一式兩未知，無法由營收單獨拆解；
      # 故稼動率取私訪區間上緣(75%)作為外部約束，殘差歸入 ASP 反解。
      2026Q3: {value: 0.75,   source: 私訪0813「1-3季平均70-75%」取上緣＋7-8月實績支持, confidence: 軟}
      2026Q4: {value: 0.78,   source: 私訪0813「4Q有望75-80%」取中值, confidence: 軟}
      2027Q1: {value: 0.78,   source: 私訪0815「抓88%，布源明年中下旬才改善」爬坡起點, confidence: 軟}
      2027Q2: {value: 0.80,   source: 同上, confidence: 軟}
      2027Q3: {value: 0.90,   source: 私訪0813「年底視布源可能接近100%」保守取90%, confidence: 軟}
      2027Q4: {value: 0.90,   source: 同上, confidence: 軟}

    # 混合 ASP：刻意「不」拆價格與組合（那是 Layer 2 的事）。
    # 26Q1/Q2 由實績反解；26H2 套用法說漲價路徑；2027 依 Wallace 裁示不再漲價。
    asp:
      2026Q1: {value: 726.7,  source: 26Q1營收91.44億反解, confidence: 反解}
      2026Q2: {value: 906.0,  source: 26Q2營收115.30億反解, confidence: 反解}
      2026Q3: {value: 1175.0, source: 2026-09-06反解自7-8月實績（稼動率75%為外部約束）, confidence: 反解}
      # ★2026Q4 為本模型最大的未解分歧：
      #   私訪0813／法說口徑：2H26 每季 ASP QoQ +15-20%  → 對應 ASP 1381
      #   Daiwa(0809)：4Q26 營收僅季增約 10%             → 對應 ASP 約 1175（持平）
      #   兩者相差 EPS 逾 3 元。基準取折衷 +8%，並把兩端明確放進 bull/bear 情境。
      2026Q4: {value: 1269.0, source: 法說指引+17.5%與券商+10%營收季增之折衷（未解分歧）, confidence: 推估}
      2027Q1: {value: 1269.0, source: Wallace 20260830裁示「2027持平不再漲價」, confidence: 軟}
      # 2027Q2-Q4 沿用 Q1（引擎自動沿用最近一個較早季度）
      # ★ 保守處理：2027 未計入產品組合升級對混合ASP的拉抬，該部分屬未入模的上行空間

  # 毛利率：本模型最大的槓桿，也是三情境唯一的分歧點
  gross_margin:
    2026Q1: {value: 0.1142, source: 26Q1財報實績, confidence: 硬}
    2026Q2: {value: 0.2202, source: 26Q2財報實績, confidence: 硬}
    2026Q3: {value: 0.28,   source: 私訪0813「3Q毛利率25-30%」取上緣, confidence: 軟}
    2026Q4: {value: 0.30,   source: 法說「玻纖布緩解後30%可達成」, confidence: 軟}
    2027Q1: {value: 0.32,   source: v19主案2027年31.0%＋管理層0820「明年上看35-40%」折衷, confidence: 推估}

  # 費用率：26Q1/Q2 由實績反解（毛利率－營益率），之後採規模效益後的水準
  opex_ratio:
    2026Q1: {value: 0.0678, source: 26Q1實績反解（11.42%－4.64%）, confidence: 反解}
    2026Q2: {value: 0.0599, source: 26Q2實績反解（22.02%－16.03%）, confidence: 反解}
    2026Q3: {value: 0.0560, source: 營收放大後費用率攤薄，沿用v44口徑, confidence: 推估}

  non_operating:
    default: {value: 0.30, source: 近八季業外平均約0.1億/月, confidence: 軟}

  # 有效稅率含中國子公司與未分配盈餘稅，故高於法定20%
  tax_rate:
    default: {value: 0.319, source: 26Q2實績反解（稅前18.78億→歸母淨利12.79億）, confidence: 反解}

  shares:
    value: 3.635
    source: 26Q2財報稀釋股數
    confidence: 硬

  month_weights:
    default: [0.32, 0.33, 0.35]
    2026Q1: [0.346, 0.285, 0.369]   # 農曆年效應，反解自2026年1-3月實際月營收
    2027Q1: [0.346, 0.285, 0.369]

# ----------------------------------------------------------------- Layer 2
# 開啟條件：握有級距別一手資料。聯茂符合——0813/0815 兩次私訪拿到各級距毛利率。
# 用途是驗證 Layer 1，不是取代它。
layer2:
  enabled: true
  crosscheck_threshold: 0.20

  tiers:
    FR4:  {price_index: 0.48, gross_margin: 0.235, source: 私訪0815「M4以下以前20出頭現在有25」, confidence: 硬}
    M4:   {price_index: 0.75, gross_margin: 0.265, source: 同上, confidence: 硬}
    M6:   {price_index: 1.00, gross_margin: 0.350, source: 私訪0813「M6由約30%提高至35%以上」, confidence: 硬}
    M7:   {price_index: 1.30, gross_margin: 0.400, source: 私訪0813「M7由約35%提高至至少40%」, confidence: 硬}
    M8:   {price_index: 2.37, gross_margin: 0.440, source: 私訪0815「M8以上48-50%」保守取44%, confidence: 軟}

  # 量佔比（非營收佔比）。26Q2 為 v25 模型反解值，之後為推估爬坡。
  mix:
    2026Q2: {FR4: 0.612, M4: 0.210, M6: 0.156, M7: 0.018, M8: 0.004}
    2026Q4: {FR4: 0.560, M4: 0.210, M6: 0.165, M7: 0.058, M8: 0.007}
    2027Q4: {FR4: 0.480, M4: 0.200, M6: 0.200, M7: 0.105, M8: 0.015}

  # M6 基準價（元/張）
  base_price:
    2026Q1: {value: 1241, source: v25模型反解, confidence: 反解}
    2026Q2: {value: 1506, source: v25模型反解（26Q2售價+21.35%）, confidence: 反解}
    2026Q3: {value: 1769, source: 套用+17.5%漲價路徑, confidence: 軟}
    2026Q4: {value: 2079, source: 同上, confidence: 軟}
    2027Q1: {value: 2079, source: 2027持平, confidence: 軟}

# ----------------------------------------------------------------- 三情境
# 唯一的分歧點放在毛利率——因為它是方差最大的變數（和益紅隊：毛利率單一變數
# 的方差大於其他所有變數方差的總和）。不要每個參數都做情境，那只會製造假精確。
scenarios:
  bull:
    label: 多頭：漲價指引全數兌現、毛利率38%
    prob: 0.25
    note: 4Q26 ASP 依私訪口徑漲足+17.5%（1381）＋2027毛利率38%（管理層0820「上看35-40%」上緣）＋稼動率再高2pp
    overrides:
      asp.2026Q4: {set: 1381.0}
      asp.2027Q1: {set: 1381.0}
      gross_margin.2027Q1: {set: 0.38}
      utilization.2027Q3: {set: 0.92}
      utilization.2027Q4: {set: 0.92}

  base:
    label: 基準：漲價守住、毛利率32%
    prob: 0.45
    note: 2027毛利率32%，介於v19主案31%與管理層口徑35-40%之間

  bear:
    label: 保守：漲價停在3Q水準、玻纖布緩解後回吐
    prob: 0.30
    note: 4Q26 ASP 持平於3Q（對應Daiwa「+10%營收季增」口徑）、2027再回落8%、毛利率回到26%、稼動率降至80%
    overrides:
      asp.2026Q4: {set: 1175.0}
      asp.2027Q1: {set: 1081.0}
      gross_margin.2027Q1: {set: 0.26}
      utilization.2027Q3: {set: 0.80}
      utilization.2027Q4: {set: 0.80}

# ----------------------------------------------------------------- 對帳設定
backtest:
  monthly_tolerance: 0.10     # 單月偏離容忍度（單月出貨時點噪音本來就大）
  consecutive_alert: 2        # 連續幾個月超標即示警

# ----------------------------------------------------------------- 失效條件
invalidation:
  - "**26Q3 毛利率 < 25%** → 基準情境降級至保守（查核：2026/11 Q3財報）"
  - "**M4以下毛利率反解值停在 23% 以下上不去** → 2027年32%假設須下修至30%（每季財報反解）"
  - "**月營收連兩月低於模型預估 10% 以上** → 稼動率假設失效（每月10日 MOPS）"
  - "**無錫 60 萬張產能時點延後逾半年** → 2027Q3/Q4 產能與折舊假設失效（法說追蹤）"
  - "**Gen6（一般型伺服器）放量再度遞延** → 2027 營收路徑撐不住（法說追蹤）"
  - "**玻纖布現貨價自高點回落 >15%** → ASP 持平假設失效，啟動保守情境（月度追蹤）"
