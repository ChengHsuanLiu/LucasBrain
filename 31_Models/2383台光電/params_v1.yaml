  bull:
    label: 多頭：Q3動能延續、M7+組合升級快於guidance
    prob: 0.25
    note: 9月維持8月動能(+4.9% MoM)，2027年M7+佔比達75-80%上緣，毛利率2027Q4達41%
    overrides:
      direct.2026Q3: {set: 604.8}
      direct.2026Q4: {set: 665.3}
      direct.2027Q1: {set: 718.5}
      direct.2027Q2: {set: 833.5}
      direct.2027Q3: {set: 950.2}
      direct.2027Q4: {set: 1054.7}
      gross_margin.2026Q3: {set: 0.365}
      gross_margin.2026Q4: {set: 0.380}
      gross_margin.2027Q1: {set: 0.390}
      gross_margin.2027Q2: {set: 0.395}
      gross_margin.2027Q3: {set: 0.400}
      gross_margin.2027Q4: {set: 0.410}
      opex_ratio.2026Q3: {set: 0.063}
      opex_ratio.2026Q4: {set: 0.060}
      opex_ratio.2027Q1: {set: 0.058}

  base:
    label: 基準：延續guidance隱含之下限之上、7-8月動能溫和遞減
    prob: 0.45
    note: 9月MoM+2%(較7-8月遞減趨勢溫和放緩)，M7+佔比循guidance路徑穩定提升至75%附近

  bear:
    label: 保守：guidance為真實上限、9月明顯回落
    prob: 0.30
    note: 9月回落至滿足guidance下限(+15% QoQ)所需水準，毛利率不再進一步升級(持平35%附近)
    overrides:
      direct.2026Q3: {set: 543.7}
      direct.2026Q4: {set: 570.9}
      direct.2027Q1: {set: 588.0}
      direct.2027Q2: {set: 635.1}
      direct.2027Q3: {set: 679.5}
      direct.2027Q4: {set: 720.3}
      gross_margin.2026Q3: {set: 0.350}
      gross_margin.2026Q4: {set: 0.355}
      gross_margin.2027Q1: {set: 0.350}
      gross_margin.2027Q2: {set: 0.350}
      gross_margin.2027Q3: {set: 0.350}
      gross_margin.2027Q4: {set: 0.350}
      opex_ratio.2026Q3: {set: 0.068}
      opex_ratio.2026Q4: {set: 0.066}
      opex_ratio.2027Q1: {set: 0.064}

# ----------------------------------------------------------------- 對帳設定
backtest:
  monthly_tolerance: 0.10
  consecutive_alert: 2

# ----------------------------------------------------------------- 失效條件
invalidation:
  - "**9月營收<205億元（較8月MoM衰退逾-15%）** → 26Q3落在guidance下限附近，base情境降級（9/10 MOPS）"
  - "**9月營收>211億元（延續8月動能）** → 實績優於本模型base，應上調至接近bull（9/10 MOPS）"
  - "**26Q3毛利率<35%** → 未達guidance下緣，M7+組合升級速度假設失效（法說/財報）"
  - "**M7+佔比2H26未達65%** → 2027年70-75%目標路徑存疑（法說追蹤）"
  - "**南亞(1303)M7/M8/M10在Rosalind/Orchid/Kyber的Second Source份額顯著擴大** → 台光電份額被侵蝕，營收路徑下修（供應鏈查核）"
  - "**生益科技M8/M9出貨佔比持續擴大且進一步切入Nvidia核心供應鏈** → 高階份額競爭壓力上升（供應鏈查核）"
