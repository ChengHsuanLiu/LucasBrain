# =============================================================================
# 台燿 6274 損益推估模型 v1
#
# 診斷結果（g Diagnose 6274）：營收效應38% ≈ 毛利率效應36%，兩者相當
# → 情境軸須同時涵蓋營收與毛利率，單押一邊會低估情境帶寬度。
#
# ⚠️ 本檔與其他模型的最大差異：頁面上已有Wallace投資幕僚團隊極完整的既有分析
# (v6→v7→v8→v9→v11，v11經Codex審查定案)，與HSBC(2026-07-31)形成明確分歧。
# 本模型刻意「不」從零重做那份分析，而是把既有分歧結構化成三情境：
#   base = v11（毛利率封頂31.62%/33.5%，主張「超越台光電歷史紀錄29.42%皆屬未證實」）
#   bull = HSBC（毛利率FY27追平台光電~39%）
#   bear = 毛利率在26Q2實績29.7%附近打平，不再進一步擴張（AWS T3品質/金像電良率風險）
#
# ⚠️ 建模時的關鍵發現：7、8月實際月營收(59.08/59.15億)加總118.23億，若9月僅打平
# 8月即可讓26Q3達177.4億(QoQ+24.0%)——已超過HSBC最樂觀的+21%與共識的+17%。
# 與台光電的情況相同：官方/法人guidance可能系統性落後於已發生的實績。
#
# 股數注意：v11模型的74.70/110.30元為**稀釋**EPS(股數3.018億)；本模型統一採用
# **基本**股數2.9198億以與26Q1/Q2已公布之基本EPS(4.36/8.02)校準一致，因此本模型
# 換算出的同一淨利水準會比v11原始數字高約3.3%，比較時請留意此基準差異。
# =============================================================================

meta:
  ticker: "6274"
  name: 台燿
  archetype: B                    # 診斷建議營收與毛利率並重；因缺分部門逐季損益，仍以direct法建構
  version: v1
  base_quarter: 2026Q2
  as_of_month: "2026-10"
  price_source: auto
  price: 1365.0
  independent_observations: 12
  unit_note: 營收獲利=億元、股數=億股（基本股數，見上方股數注意）

horizon:
  start: 2026Q1
  end: 2027Q4

# ----------------------------------------------------------------- 實績
actuals:
  2026Q1:
    revenue: 100.54
    gross_margin: 0.2515
    op_margin: 0.1818
    eps: 4.36
    source: FinMind 26Q1財報（與頁面既有「近六季財報數據」表完全吻合）
  2026Q2:
    revenue: 143.01
    gross_margin: 0.2972
    op_margin: 0.2348
    eps: 8.02
    source: FinMind 26Q2財報；v11模型同步確認之基本EPS 8.02元(稀釋7.76元)

# ----------------------------------------------------------------- 外部錨
consensus:
  source: 投資幕僚v11模型(2026-08-02，經Codex審查定案，稀釋股數) vs HSBC(2026-07-31，TUC，稀釋股數)
  as_of: 2026-08-02
  eps:
    2026: 33.96
    2027: 74.70
  note: >
    v11與HSBC的分歧核心是「台燿毛利率能否於FY27追平台光電(~39%)」，v11主張不行
    (封頂31.62%)、HSBC主張可以。v11自訂的驗證門檻是26Q3毛利率≥30.5%——本模型
    base情境的26Q3毛利率(30.5%)刻意取在此門檻上，即本模型的base本身就是v11論點
    成立與否的臨界情境，26Q3財報公布後應第一時間檢驗。另注意上列共識EPS為
    **稀釋**基準，與本模型基本股數輸出有約3.3%的系統性差異(見meta說明)。
    ⚠️ **base情境套用與v11相同的毛利率路徑(31.62%封頂)後，本模型算出2027 EPS
    58.98元，仍較v11的74.70元低21%**——代表兩者的分歧其實不在毛利率(兩者一致)，
    而在**營收成長路徑**：v11是年度由上而下模型、未拆解季度營收橋接，反解其
    2027隱含營收約需達1,263億元(net income 225.4億元反推)，較本模型base的季度
    爬坡加總962億元高出31%。本模型的季度爬坡係依HSBC「FY27產能年增46%」的
    產能成長率外推，v11的隱含營收路徑則需要額外的ASP/組合升級才能達到，且該
    路徑並未在既有筆記中明確拆解。這是本次建模發現的新問題，而非重新確認舊
    結論：下次法說應直接追問「2027年營收成長的量/價貢獻拆分」以解開此分歧。

# ----------------------------------------------------------------- Layer 1
layer1:
  revenue:
    method: direct
    direct:
      2026Q1: {value: 100.54, source: 26Q1實績, confidence: 硬}
      2026Q2: {value: 143.01, source: 26Q2實績, confidence: 硬}
      # 26Q3：7+8月實際118.23億(硬)+9月推估，同台光電模型邏輯。
      2026Q3: {value: 177.4,  source: 7-8月實績118.23億(7月月增20.7%後8月僅+0.1%)＋9月假設打平8月(59.15億), confidence: 反解}
      2026Q4: {value: 191.6,  source: QoQ+8%(泰國廠稼動率持續爬坡，HSBC口徑), confidence: 推估}
      2027Q1: {value: 201.2,  source: QoQ+5%(農曆年效應), confidence: 推估}
      2027Q2: {value: 231.4,  source: QoQ+15%(中國/泰國新產能開始貢獻，HSBC「FY27產能年增46%」路徑), confidence: 推估}
      2027Q3: {value: 254.5,  source: QoQ+10%, confidence: 推估}
      2027Q4: {value: 274.9,  source: QoQ+8%, confidence: 推估}

  gross_margin:
    2026Q1: {value: 0.2515, source: 26Q1實績, confidence: 硬}
    2026Q2: {value: 0.2972, source: 26Q2實績, confidence: 硬}
    # ★ base的26Q3值(30.5%)＝v11自訂驗證門檻，非獨立推估，具體見上方note
    2026Q3: {value: 0.305,  source: v11模型驗證門檻「≥30.5%則2027路徑成立」，取門檻值本身作base, confidence: 軟}
    2026Q4: {value: 0.310,  source: v11模型2027路徑之前置延伸, confidence: 推估}
    2027Q1: {value: 0.313,  source: v11模型2027封頂31.62%之爬坡路徑, confidence: 推估}
    2027Q2: {value: 0.315,  source: 同上, confidence: 推估}
    2027Q3: {value: 0.316,  source: 同上, confidence: 推估}
    2027Q4: {value: 0.3162, source: v11模型2027年毛利率封頂值(=台光電26Q2實績33.85%為天花板證據錨定下的收斂結果), confidence: 軟}

  # 費用率隨規模攤薄：26Q1 6.97%→26Q2 6.23%
  opex_ratio:
    2026Q1: {value: 0.0697, source: 26Q1實績反解, confidence: 反解}
    2026Q2: {value: 0.0623, source: 26Q2實績反解, confidence: 反解}
    2026Q3: {value: 0.060,  source: 規模效益延續, confidence: 推估}
    2026Q4: {value: 0.058,  source: 同上, confidence: 推估}
    2027Q1: {value: 0.056,  source: 邊際效益遞減後趨於平緩, confidence: 推估}

  non_operating:
    default: {value: 0.7, source: 26Q1/Q2業外實績0.46/0.69億，取近期水準, confidence: 反解}

  # 有效稅率26Q1 32.76%/26Q2 31.67%，相對穩定，取近期均值
  tax_rate:
    default: {value: 0.317, source: 26Q1/Q2實績反解均值(32.76%/31.67%), confidence: 反解}

  # 採基本股數，與26Q1/Q2已公布基本EPS校準一致；v11/HSBC原始數字為稀釋股數3.018億
  shares:
    value: 2.9198
    source: 26Q2財報基本股數(稀釋3.018億，稀釋幅度3.3%)
    confidence: 硬

  month_weights:
    default: [0.33, 0.33, 0.34]
    2026Q1: [0.351, 0.273, 0.376]   # 反解自實際月營收(35.33/27.41/37.82)
    2026Q3: [0.333, 0.333, 0.334]   # 7/8月實績(59.08/59.15)幾乎持平，第三月採相同權重

# ----------------------------------------------------------------- Layer 2
layer2:
  enabled: false
  # 不啟用。雖然公司有揭露26Q1四大產品線佔比(ELL+SLL 38%/VLL+LL 32%/HDI+N-LL 18%/
  # 其他12%)，但缺乏26Q2以後逐季更新的分部門佔比與各線精確毛利率(僅有Wallace團隊
  # 自估的29%/32%/35%假設，非公司揭露值)，若強行拆解只會把「毛利率一個爭議」拆成
  # 「四條產品線各自的爭議」。診斷顯示營收與毛利率並重，但這裡的毛利率爭議本質是
  # 「能否追平產業龍頭」的單一問題，不是產品組合細節問題，Layer1情境軸已直接處理。
  #
  # 開啟條件：拿到26Q2以後任一季的官方分部門營收/毛利率揭露。

