# =============================================================================
# 景碩 3189 損益推估模型 v1
#
# 診斷結果（g Diagnose 3189，2026-09-10）：毛利率效應佔變異40.4%、費用率效應37.2%
# 為前二大來源，業外僅12.5%（依賴度平均24%，未達look-through門檻）→ 不啟用
# equity_income，情境軸放在毛利率＋費用率（opex_ratio）。
#
# ⚠️ 建模時的關鍵發現：景碩合併子公司晶碩(6491，隱形眼鏡)存在少數股權，
# 「稅後淨利」與「歸屬母公司淨利(EPS基礎)」之間有缺口，且缺口比例逐季不同
# （反解 parent_ratio：26Q1約86.8%、26Q2約99.2%），研判與晶碩自身獲利占比
# 波動有關。本模型未取得精確流通股數之一手來源，以2Q26實績反解之6.5億股
# 為估計值（confidence: 推估），forward parent_ratio 亦取兩季平均。此為本模型
# 目前最脆弱的參數，若後續能取得公司股本/晶碩損益之一手資料應優先修正。
# =============================================================================

meta:
  ticker: "3189"
  name: 景碩
  archetype: A
  version: v1
  base_quarter: 2026Q2
  as_of_month: "2026-09"
  price_source: auto
  price: 795.0
  independent_observations: 10   # 6/21調研、6/26座談、6/29買進報告、6/30 Citi、6/30福邦、7/12 GS、7/21-22凱基(x2)、8/3 GS更新、8/6 GS AT&S read-across、8/25國泰Call Memo(最詳盡)
  unit_note: 營收獲利=億元、股數=億股

horizon:
  start: 2026Q1
  end: 2028Q4

