# ----------------------------------------------------------------- Layer 2
layer2:
  enabled: false
  # 不啟用segments拆分。景碩雖有ABF(44.7%)/BT(38.4%)/隱形眼鏡(16.9%子公司晶碩)
  # 三塊業務，但晶碩為獨立上市公司(6491)、無獨立逐季營收指引可用於本模型，
  # 強行拆segments只會在完全沒有一手資料的區塊(隱形眼鏡)填入瞎猜數字，
  # 反而讓誤差來源變多。現行以公司層級direct revenue + 單一毛利率序列已能
  # 捕捉診斷腳本指出的兩大變異來源(毛利率40%+費用率37%)，Layer 2報酬率偏低。
  #
  # 開啟條件：取得晶碩(6491)獨立財測，或景碩法說明確拆分ABF/BT各自季營收
  # 與毛利率數字（目前僅有「BT毛利率15%→20%+」等定性/區間描述）。

# ----------------------------------------------------------------- 三情境
# 診斷腳本指出毛利率(40.4%)與費用率(37.2%)為前二大變異來源，情境分歧點
# 同時涵蓋兩者；營收變動幅度較小(僅反映T-Glass缺料/ABF擴產時程之上下限)。
scenarios:
  bull:
    label: 多頭：BT轉單+ABF漲價超預期、T-Glass缺料提前緩解
    prob: 0.25
    note: 欣興轉單效應強於預期帶動BT毛利率提前突破20%，ABF競標溢價高於guidance基本幅，2028年AI substrate市占率達GS樂觀情境27%上緣
    overrides:
      direct.2027Q1: {mul: 1.05}
      direct.2027Q2: {mul: 1.05}
      direct.2027Q3: {mul: 1.05}
      direct.2027Q4: {mul: 1.05}
      direct.2028Q1: {mul: 1.05}
      direct.2028Q2: {mul: 1.05}
      direct.2028Q3: {mul: 1.05}
      direct.2028Q4: {mul: 1.05}
      gross_margin.2026Q4: {add: 0.02}
      gross_margin.2027Q1: {add: 0.02}
      opex_ratio.2026Q4: {add: -0.01}
      opex_ratio.2027Q1: {add: -0.01}

  base:
    label: 基準：延續國泰/GS guidance路徑，BT轉單與ABF擴產按時程兌現
    prob: 0.45
    note: 3-4Q26 QoQ+10%營收成長兌現，2027-28年營收YoY+30%目標達成，毛利率按guidance漸進改善但略保守於上緣

  bear:
    label: 保守：T-Glass缺料惡化、Vera CPU放量遞延
    prob: 0.30
    note: 缺料對營收之影響擴大超過現有10-15%區間，ABF稼動率年底未拉滿至95%，BT轉單效應遞延至2027年、毛利率未能突破20%
    overrides:
      direct.2026Q4: {mul: 0.92}
      direct.2027Q1: {mul: 0.90}
      direct.2027Q2: {mul: 0.90}
      direct.2027Q3: {mul: 0.90}
      direct.2027Q4: {mul: 0.90}
      direct.2028Q1: {mul: 0.90}
      direct.2028Q2: {mul: 0.90}
      direct.2028Q3: {mul: 0.90}
      direct.2028Q4: {mul: 0.90}
      gross_margin.2026Q4: {add: -0.02}
      gross_margin.2027Q1: {add: -0.03}
      gross_margin.2027Q2: {add: -0.03}
      gross_margin.2027Q3: {add: -0.03}
      gross_margin.2027Q4: {add: -0.03}
      opex_ratio.2026Q4: {add: 0.01}
      opex_ratio.2027Q1: {add: 0.01}

# ----------------------------------------------------------------- 對帳設定
backtest:
  monthly_tolerance: 0.10
  consecutive_alert: 2

# ----------------------------------------------------------------- 失效條件
invalidation:
  - "**3Q26營收<130億元（未達QoQ+10%guidance下限）** → 動能弱於國泰/GS一致guidance，base情境降級（10月MOPS）"
  - "**3Q26毛利率<27%** → 未達guidance下緣，ABF/BT漲價與組合升級速度假設失效（法說/財報）"
  - "**T-Glass缺料對營收影響擴大超過15%（現況10-15%）** → ABF稼動率年底無法拉滿至95%，revenue路徑下修（供應鏈查核）"
  - "**欣興(3037) BT產能裁減/轉單時程延後至2027年後** → 景碩BT毛利率突破20%假設落空，2027年毛利率路徑下修（法說追蹤）"
  - "**Nvidia Vera CPU市佔率年底未達80%以上（現目標100%）** → AI營收占比成長路徑不如預期，2027-28年營收/毛利率雙雙下修（供應鏈查核）"
  - "**有效稅率回升至接近法定稅率20%（現況5-10%）** → 投資抵減用罄，EPS路徑系統性下修約10-15%（財報追蹤）"
