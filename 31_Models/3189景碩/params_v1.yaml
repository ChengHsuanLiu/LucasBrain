  2026Q2:
    revenue: 124.96
    gross_margin: 0.2610
    op_margin: 0.1343
    eps: 2.57
    source: FinMind 26Q2財報，與國泰證期8/25 Call Memo「2Q26合併營收124.96億元、毛利率26.1%、費用率12.7%、EPS 2.57元」完全吻合，交叉驗證通過

# ----------------------------------------------------------------- 外部錨
consensus:
  source: Goldman Sachs 2026-08-03《2Q26法說後追蹤電話會議》（TP 1,125元，16.5x 2028E P/E，本庫最新且逐年最完整之估計）
  as_of: 2026-08-03
  eps:
    2026: 11.79
    2027: 35.10
    2028: 68.29
    2029: 118.18
  note: >
    國泰證期8/25 Call Memo（公司自身House座談，非獨立法人estimate）給出「2026年營收
    YoY+35%、毛利率26-27%、EPS約10元」，略低於GS的11.79元，兩者可視為同一時點下的
    保守/略樂觀區間對照。凱基(7/21-22，TP935)與Citi(6/30，TP1,100)兩份報告皆早於
    8月正式2Q26財報公布與GS 8/3電話會議更新，時效性已被後續資訊超越，視為stale
    不納入consensus錨點，僅作為Notes&Memos歷史對照。

